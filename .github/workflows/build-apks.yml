name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build FoxyVPN (main app) v3.4.0 — standard identity
        working-directory: android-app
        env:
          SIGNING_STORE_PASSWORD: foxyvpn
          SIGNING_KEY_ALIAS: foxyvpn
          SIGNING_KEY_PASSWORD: foxyvpn
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect standard APK
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/release/app-release.apk out/FoxyVPN-v3.4.0.apk

      - name: Build FoxyVPN Fresh identity v3.4.0 (com.foxy.vpn)
        working-directory: android-app
        env:
          SIGNING_STORE_PASSWORD: foxyvpn
          SIGNING_KEY_ALIAS: foxyvpn
          SIGNING_KEY_PASSWORD: foxyvpn
        run: |
          rm -rf app/build/outputs
          gradle assembleRelease --no-daemon --stacktrace -PfoxyFreshIdentity=true

      - name: Collect fresh-identity APK + verify package name
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk out/FoxyVPN-Fresh-v3.4.0.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort | tail -1)
          echo "=== standard package ==="
          "$BT/aapt" dump badging out/FoxyVPN-v3.4.0.apk | head -2
          echo "=== fresh package ==="
          "$BT/aapt" dump badging out/FoxyVPN-Fresh-v3.4.0.apk | head -2

      - name: Build FoxyKeygen v2.3.0
        working-directory: keygen-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          cp keygen-app/app/build/outputs/apk/release/app-release.apk out/FoxyKeygen-v2.3.0.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-APKs
          path: out/*.apk
          if-no-files-found: error
