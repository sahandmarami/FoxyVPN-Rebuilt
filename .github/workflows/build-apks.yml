name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses (preinstalled SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build FoxyVPN (main app) — standard identity
        working-directory: android-app
        env:
          SIGNING_STORE_PASSWORD: foxyvpn
          SIGNING_KEY_ALIAS: foxyvpn
          SIGNING_KEY_PASSWORD: foxyvpn
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect standard APK (name from versionName)
        run: |
          mkdir -p out
          VER=$(grep -oP 'versionName = "\K[^"]+' android-app/app/build.gradle.kts | head -1)
          cp android-app/app/build/outputs/apk/release/app-release.apk "out/FoxyVPN-v$VER.apk"
          echo "MAIN_VER=$VER" >> "$GITHUB_ENV"

      - name: Build FoxyVPN Fresh identity (com.foxy.vpn)
        working-directory: android-app
        env:
          SIGNING_STORE_PASSWORD: foxyvpn
          SIGNING_KEY_ALIAS: foxyvpn
          SIGNING_KEY_PASSWORD: foxyvpn
        run: |
          rm -rf app/build/outputs
          gradle assembleRelease --no-daemon --stacktrace -PfoxyFreshIdentity=true

      - name: Collect fresh-identity APK + verify package name
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk "out/FoxyVPN-Fresh-v$MAIN_VER.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort | tail -1)
          echo "=== standard package ==="
          "$BT/aapt" dump badging "out/FoxyVPN-v$MAIN_VER.apk" | head -2
          echo "=== fresh package ==="
          "$BT/aapt" dump badging "out/FoxyVPN-Fresh-v$MAIN_VER.apk" | head -2

      - name: Build FoxyKeygen
        working-directory: keygen-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          KEY_VER=$(grep -oP 'versionName = "\K[^"]+' keygen-app/app/build.gradle.kts | head -1)
          cp keygen-app/app/build/outputs/apk/release/app-release.apk "out/FoxyKeygen-v$KEY_VER.apk"
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FoxyVPN-APKs
          path: out/*.apk
          if-no-files-found: error
